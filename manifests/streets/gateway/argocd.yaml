apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: streets-ecommerce
  namespace: argocd
spec:
  project: default
  source:
    # ?�용?�님??GitHub ?�?�소 주소
    repoURL: https://github.com/YuJeong-Jang/E-commerce-12th-Street.git
    targetRevision: myong/gajae
    path: manifests/streets # 매니?�스?�들??모여?�는 경로
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
