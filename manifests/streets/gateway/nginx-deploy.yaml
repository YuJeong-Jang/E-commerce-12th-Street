# [1] IngressClass (버전 1.x ?�수 리소??
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: nginx
  labels:
    app: frontend-ingress
spec:
  controller: k8s.io/ingress-nginx

---
# [2] ?�비???�카?�트
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nginx-ingress-serviceaccount
  namespace: web-proxy

---
# [3] ?�러?�터 �?(권한 ?�의 - ingressclasses ?�함)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nginx-ingress-clusterrole
rules:
  - apiGroups: ["", "networking.k8s.io"]
    resources: ["configmaps", "endpoints", "nodes", "pods", "secrets", "services", "ingresses", "ingresses/status", "ingressclasses"]
    verbs: ["get", "list", "watch", "update", "create", "patch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "update", "create", "patch"]

---
# [4] �?바인??(권한 부??
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nginx-ingress-clusterrole-nisa-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nginx-ingress-clusterrole
subjects:
  - kind: ServiceAccount
    name: nginx-ingress-serviceaccount
    namespace: web-proxy

---
# [5] ?�플로이먼트 (컨트롤러 ?�행)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deploy
  namespace: web-proxy
  labels:
    app: frontend-ingress
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-ingress
  template:
    metadata:
      labels:
        app: frontend-ingress
    spec:
      serviceAccountName: nginx-ingress-serviceaccount
      
      # ECR ?�증 ?�보
      imagePullSecrets:
        - name: ecr-cred-nginx
      
      containers:
        - name: controller
          # 빌드?�서 ?�린 ?� ?��?지 (v1.1)
          image: 745173969277.dkr.ecr.ap-northeast-2.amazonaws.com/web-proxy:v1.1
          imagePullPolicy: Always
          
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LD_PRELOAD
              value: /usr/local/lib/libmimalloc.so
          
          args:
            - /nginx-ingress-controller
            - --election-id=ingress-controller-leader
            - --controller-class=k8s.io/ingress-nginx
            - --ingress-class=nginx
            - --configmap=$(POD_NAMESPACE)/nginx-config
            - --publish-service=$(POD_NAMESPACE)/nginx-service
            - --watch-ingress-without-class=true
          
          ports:
            - containerPort: 80
            - containerPort: 443
          
          # ?�스체크 (초기 지???�간 15초로 ?�넉?�게)
          livenessProbe:
            httpGet:
              path: /healthz
              port: 10254
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 10254
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 10
