# ë´‡ì´ ?œí¬ë¦¿ì„ ì§€?°ê³  ?¤ì‹œ ë§Œë“¤ ???ˆëŠ” ê¶Œí•œ??ì¤ë‹ˆ??
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecr-refresh-sa
  namespace: web-proxy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secret-manager-role
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["delete", "create", "get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secret-manager-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: secret-manager-role
subjects:
  - kind: ServiceAccount
    name: ecr-refresh-sa
    namespace: web-proxy

---
# 2. ?¬ë¡ ??(CronJob) ?•ì˜
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ecr-refresh-job
  namespace: web-proxy
spec:
  # 10?œê°„ë§ˆë‹¤ ?¤í–‰ (ë¶????????”ì¼)
  schedule: "0 */10 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: ecr-refresh-sa
          containers:
          - name: ecr-refresh
            image: google/cloud-sdk:alpine  # kubectl???¬í•¨??ê°€ë²¼ìš´ ?´ë?ì§€
            command:
            - /bin/sh
            - -c
            - |
              # 1. ?„ìš”???„êµ¬ ?¤ì¹˜ (AWS CLI)
              apk add --no-cache aws-cli
              
              # 2. ECR ë¡œê·¸??? í° ê°€?¸ì˜¤ê¸?
              TOKEN=$(aws ecr get-login-password --region ap-northeast-2)
              
              # 3. ê°??¤ì„?¤í˜?´ìŠ¤ë³??œí¬ë¦?ê°±ì‹  (??–´?°ê¸°)
              
              # (1) web-proxy (nginx)
              kubectl delete secret ecr-cred-nginx -n web-proxy --ignore-not-found
              kubectl create secret docker-registry ecr-cred-nginx \
                --docker-server=745173969277.dkr.ecr.ap-northeast-2.amazonaws.com \
                --docker-username=AWS \
                --docker-password=$TOKEN \
                -n web-proxy
              
              # (2) member-service
              kubectl delete secret ecr-cred-member -n member-service --ignore-not-found
              kubectl create secret docker-registry ecr-cred-member \
                --docker-server=745173969277.dkr.ecr.ap-northeast-2.amazonaws.com \
                --docker-username=AWS \
                --docker-password=$TOKEN \
                -n member-service
              
              # (3) board-service
              kubectl delete secret ecr-cred-board -n board-service --ignore-not-found
              kubectl create secret docker-registry ecr-cred-board \
                --docker-server=745173969277.dkr.ecr.ap-northeast-2.amazonaws.com \
                --docker-username=AWS \
                --docker-password=$TOKEN \
                -n board-service
                
              echo "All ECR secrets refreshed successfully!"
            
            envFrom:
            - secretRef:
                name: aws-secret  # 1?¨ê³„?ì„œ ë§Œë“  AWS ?‘ì† ?•ë³´ ?¬ìš©
          
          restartPolicy: OnFailure
