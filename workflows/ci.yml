name: CI Pipeline

on:
  push:
    branches: [ "myong/gajae" ]

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Push Member Service
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }} # 커밋 해시를 태그로 사용
        run: |
          docker build -t $ECR_REGISTRY/member-service:$IMAGE_TAG -f dockerfile .
          docker push $ECR_REGISTRY/member-service:$IMAGE_TAG
          
      # 이미지 태그 업데이트 (GitOps 방식)
      - name: Update Manifest
        run: |
          sed -i "s|image: .*member-service:.*|image: ${{ steps.login-ecr.outputs.registry }}/member-service:${{ github.sha }}|g" manifests/streets/member-service/member-deploy.yaml
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub Actions"
          git add .
          git commit -m "chore: update image tag to ${{ github.sha }}"
          git push