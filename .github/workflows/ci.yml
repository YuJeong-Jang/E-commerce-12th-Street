name: CI Pipeline

on:
  push:
    branches: [ "myong/gajae" ]

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Push All Services
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          # 1. Member Service 빌드/푸시
          docker build --build-arg SERVICE_NAME=streets-member -t $REGISTRY/member-service:$SHA -f dockerfile .
          docker push $REGISTRY/member-service:$SHA

          # 2. Board Service 빌드/푸시
          docker build --build-arg SERVICE_NAME=streets-board -t $REGISTRY/board-service:$SHA -f dockerfile .
          docker push $REGISTRY/board-service:$SHA

          # 3. Nginx(Web-Proxy) 빌드/푸시
          # ※ Nginx용 Dockerfile 위치가 다르면 -f 경로를 수정하세요.
          docker build -t $REGISTRY/web-proxy:$SHA -f manifests/streets/gateway/dockerfile-nginx .
          docker push $REGISTRY/web-proxy:$SHA

      - name: Update All Manifests
        run: |
          REG=${{ steps.login-ecr.outputs.registry }}
          SHA=${{ github.sha }}

          # 각 서비스의 배포 파일 내 이미지 태그 일괄 업데이트
          sed -i "s|image: .*/member-service:.*|image: ${REG}/member-service:${SHA}|g" manifests/streets/member-service/member-deploy.yaml
          sed -i "s|image: .*/board-service:.*|image: ${REG}/board-service:${SHA}|g" manifests/streets/board-service/board-deploy.yaml
          sed -i "s|image: .*/web-proxy:.*|image: ${REG}/web-proxy:${SHA}|g" manifests/streets/gateway/nginx-deploy.yaml

          # 변경사항 커밋 및 푸시
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub Actions"
          git add manifests/streets/member-service/member-deploy.yaml \
                  manifests/streets/board-service/board-deploy.yaml \
                  manifests/streets/gateway/nginx-deploy.yaml
          git commit -m "chore: update all service image tags to ${SHA}"
          git push