name: CI Pipeline

on:
  push:
    branches: [ "myong/gajae" ]

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Push Member Service
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # --build-arg SERVICE_NAME=streets-member 를 반드시 추가해야 합니다.
          docker build \
            --build-arg SERVICE_NAME=streets-member \
            -t $ECR_REGISTRY/member-service:$IMAGE_TAG \
            -f dockerfile .
          docker push $ECR_REGISTRY/member-service:$IMAGE_TAG
          
      # 이미지 태그 업데이트 (GitOps 방식)
      - name: Update Manifest
        run: |
          # [권장] 구분자를 | 대신 @ 등을 써서 주소 내의 슬래시(/) 충돌을 방지하고, 
          # 이미지 이름 뒤의 콜론(:) 이후 태그 부분만 정확히 찝어서 바꿉니다.
          sed -i "s|image: .*/member-service:.*|image: ${{ steps.login-ecr.outputs.registry }}/member-service:${{ github.sha }}|g" manifests/streets/member-service/member-deploy.yaml
          
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub Actions"
          git add manifests/streets/member-service/member-deploy.yaml
          git commit -m "chore: update member-service image tag to ${{ github.sha }}"
          git push