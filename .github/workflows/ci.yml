name: CI Pipeline

on:
  push:
    branches: [ "myong/gajae" ]

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # --- 1. Member Service 빌드 및 푸시 ---
      - name: Build and Push Member Service
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg SERVICE_NAME=streets-member \
            -t $ECR_REGISTRY/member-service:$IMAGE_TAG \
            -f dockerfile .
          docker push $ECR_REGISTRY/member-service:$IMAGE_TAG

      # --- 2. Board Service 빌드 및 푸시 (추가) ---
      - name: Build and Push Board Service
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg SERVICE_NAME=streets-board \
            -t $ECR_REGISTRY/board-service:$IMAGE_TAG \
            -f dockerfile .
          docker push $ECR_REGISTRY/board-service:$IMAGE_TAG

      # --- 3. 매니페스트 업데이트 (GitOps) ---
      - name: Update Manifests
        run: |
          ECR_URL=${{ steps.login-ecr.outputs.registry }}
          SHA=${{ github.sha }}
          
          # Member 매니페스트 수정
          sed -i "s|image: .*/member-service:.*|image: ${ECR_URL}/member-service:${SHA}|g" manifests/streets/member-service/member-deploy.yaml
          
          # Board 매니페스트 수정
          sed -i "s|image: .*/board-service:.*|image: ${ECR_URL}/board-service:${SHA}|g" manifests/streets/board-service/board-deploy.yaml
          
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub Actions"
          git add manifests/streets/member-service/member-deploy.yaml manifests/streets/board-service/board-deploy.yaml
          git commit -m "chore: update image tags for member and board services to ${SHA}"
          git push